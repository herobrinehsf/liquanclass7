<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="全国34个省级行政区近3000所普通高校官网一站式导航，点击即可进入学校官方网站。">
<title>中国大学官网导航 · 全国高校一站式入口</title>
<style>
  :root {
    --primary: #1e3c72;
    --primary-light: #2a5298;
    --accent: #3b82f6;
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #333;
    --text-muted: #999;
    --radius: 12px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    --shadow-md: 0 8px 24px rgba(0,0,0,.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
    padding: 64px 20px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.08) 0%, transparent 60%);
    pointer-events: none;
  }
  header h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  header .subtitle {
    font-size: 15px;
    opacity: .85;
  }
  header .stats {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  header .stats span {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.18);
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 13px;
    backdrop-filter: blur(6px);
  }

  .search-wrap {
    max-width: 640px;
    margin: 28px auto 0;
  }
  .search-bar {
    display: flex;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
  }
  .search-bar input {
    flex: 1;
    padding: 14px 18px;
    border: none;
    font-size: 15px;
    outline: none;
    color: var(--text);
    background: transparent;
  }
  .search-bar button {
    padding: 0 28px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  .search-bar button:hover { background: #2563eb; }

  .search-hint {
    margin-top: 10px;
    font-size: 12.5px;
    opacity: .75;
  }

  /* ---------- Main ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .region-block { margin-bottom: 44px; }
  .region-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .region-header h2 {
    font-size: 19px;
    font-weight: 700;
    color: var(--primary);
    padding-left: 12px;
    border-left: 4px solid var(--primary-light);
  }
  .region-header .region-count {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }

  /* ---------- 省份卡片 ---------- */
  .province-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 22px 16px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    color: inherit;
    transition: transform .18s ease, box-shadow .18s ease;
    border: 1px solid rgba(0,0,0,.03);
  }
  .province-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
  }
  .province-card .emoji {
    font-size: 34px;
    line-height: 1;
    margin-bottom: 10px;
  }
  .province-card .pname {
    font-size: 17px;
    font-weight: 700;
    color: var(--primary);
  }
  .province-card .pcount {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .province-card .pcount b {
    color: var(--primary-light);
    font-size: 14px;
  }

  /* ---------- 搜索结果 ---------- */
  .result-title {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .result-title b { color: var(--primary-light); }

  .school-card {
    display: block;
    padding: 14px 16px;
    background: var(--card);
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    transition: transform .15s, box-shadow .15s;
    border: 1px solid rgba(0,0,0,.03);
  }
  .school-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.1);
  }
  .school-card .sname {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--primary);
    display: block;
    line-height: 1.4;
  }
  .school-card .smeta {
    margin-top: 7px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }
  .school-card .stag {
    font-size: 11px;
    color: #fff;
    background: var(--primary-light);
    padding: 1px 7px;
    border-radius: 4px;
  }
  .school-card .stag.zhuanke { background: #16a34a; }
  .school-card .stag.minban  { background: #ea580c; }
  .school-card .stag.gaozhi  { background: #7c3aed; }
  .school-card .sprov {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }

  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 2;
  }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    padding: 34px 20px 44px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.9;
    border-top: 1px solid rgba(0,0,0,.05);
    background: #fff;
  }
  footer a {
    color: var(--primary-light);
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }

  /* ---------- 回到顶部 ---------- */
  #backTop {
    position: fixed;
    right: 24px;
    bottom: 32px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--primary-light);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(42,82,152,.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 99;
  }
  #backTop.show { opacity: 1; pointer-events: auto; }
  #backTop:hover { transform: translateY(-3px); }

  /* ---------- 响应式 ---------- */
  @media (max-width: 640px) {
    header { padding: 46px 16px 40px; }
    header h1 { font-size: 24px; }
    header .subtitle { font-size: 13.5px; }
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .province-card { padding: 18px 10px; }
    .province-card .emoji { font-size: 28px; }
    .province-card .pname { font-size: 15px; }
    main { padding: 28px 14px 50px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎓 中国大学官网导航</h1>
  <p class="subtitle">全国 34 个省级行政区 · 近 3000 所高校官网一站式入口</p>

  <div class="stats">
    <span>🏫 2900+ 所高校</span>
    <span>🎓 1365 所本科</span>
    <span>🔧 1554 所专科</span>
    <span>🏛️ 147 所双一流</span>
  </div>

  <div class="search-wrap">
    <div class="search-bar">
      <input type="text" id="kw" placeholder="搜索学校名称或省份，如：内蒙古大学 / 北京" autocomplete="off">
      <button id="searchBtn">搜索</button>
    </div>
    <div class="search-hint">支持模糊搜索 · 按回车快速查询</div>
  </div>
</header>

<main id="app"></main>

<footer>
  数据来源：<a href="http://www.moe.gov.cn/" target="_blank" rel="noopener">教育部《全国高等学校名单》</a>（截至 2025 年 6 月 20 日）<br>
  提示：部分官网地址可能更新，请以学校最新公布为准 · 本站仅供学习交流使用
</footer>

<button id="backTop" title="回到顶部">↑</button>

<script src="data.js"></script>
<script>
/* ============================================================
   中国大学官网导航 · 主页面逻辑
   ============================================================ */

// ---------- 地区分组 ----------
const REGION_GROUPS = [
  { name: "华北地区", ids: ["beijing","tianjin","hebei","shanxi","neimenggu"] },
  { name: "东北地区", ids: ["liaoning","jilin","heilongjiang"] },
  { name: "华东地区", ids: ["shanghai","jiangsu","zhejiang","anhui","fujian","jiangxi","shandong"] },
  { name: "华中地区", ids: ["henan","hubei","hunan"] },
  { name: "华南地区", ids: ["guangdong","guangxi","hainan"] },
  { name: "西南地区", ids: ["chongqing","sichuan","guizhou","yunnan","xizang"] },
  { name: "西北地区", ids: ["shaanxi","gansu","qinghai","ningxia","xinjiang"] },
  { name: "港澳台地区", ids: ["xianggang","aomen","taiwan"] }
];

const MAX_RESULTS = 300; // 搜索结果最多渲染条数，防止卡顿

// ---------- 建立学校索引（用于搜索） ----------
let SCHOOL_INDEX = [];
function buildSchoolIndex() {
  SCHOOL_INDEX = [];
  Object.keys(UNIVERSITY_DATA).forEach(pid => {
    const p = UNIVERSITY_DATA[pid];
    (p.schools || []).forEach(s => {
      SCHOOL_INDEX.push({
        pid: pid,
        pname: p.name,
        name: s[0],
        url: s[1],
        tag: s[2] || ""
      });
    });
  });
}

// ---------- 工具函数 ----------
function getProvinceById(id) {
  return PROVINCES.find(p => p.id === id);
}

function tagClass(tag) {
  let cls = "stag";
  if (tag.includes("专科")) cls += " zhuanke";
  if (tag.includes("民办")) cls += " minban";
  if (tag.includes("职业")) cls += " gaozhi";
  return cls;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

// ---------- 渲染：省份总览 ----------
function renderProvinces() {
  const app = document.getElementById("app");
  let html = "";

  REGION_GROUPS.forEach(group => {
    const provinces = group.ids.map(getProvinceById).filter(Boolean);
    if (!provinces.length) return;

    const totalCount = provinces.reduce((sum, p) => sum + (p.count || 0), 0);

    html += `<section class="region-block">`;
    html += `<div class="region-header">
               <h2>${group.name}</h2>
               <span class="region-count">${provinces.length} 个省级行政区 · ${totalCount} 所高校</span>
             </div>`;
    html += `<div class="grid">`;

    provinces.forEach(p => {
      html += `<a class="province-card" href="${p.id}.html">
                 <div class="emoji">${p.emoji}</div>
                 <div class="pname">${escapeHtml(p.name)}</div>
                 <div class="pcount">共 <b>${p.count || 0}</b> 所高校</div>
               </a>`;
    });

    html += `</div></section>`;
  });

  app.innerHTML = html;
}

// ---------- 渲染：搜索结果 ----------
function renderSearchResults(kw) {
  const app = document.getElementById("app");
  const lower = kw.toLowerCase();

  // 1. 命中的省份（关键词匹配省名）
  const matchedProvinces = PROVINCES.filter(p =>
    p.name.toLowerCase().includes(lower) ||
    p.fullName.toLowerCase().includes(lower)
  );
  const provinceIdSet = new Set(matchedProvinces.map(p => p.id));

  // 2. 命中的学校（关键词匹配校名）
  const matchedSchools = SCHOOL_INDEX.filter(s =>
    s.name.toLowerCase().includes(lower)
  );

  // 3. 若命中省份，则该省所有学校一并展示
  const extraSchools = SCHOOL_INDEX.filter(s => provinceIdSet.has(s.pid));

  // 合并去重
  const allSchools = [...extraSchools];
  matchedSchools.forEach(s => {
    if (!allSchools.find(x => x.url === s.url)) allSchools.push(s);
  });

  if (!allSchools.length) {
    app.innerHTML = `<div class="empty">
        😢 未找到与「${escapeHtml(kw)}」相关的学校<br>
        <span style="font-size:12.5px;opacity:.7;">换个关键词试试，比如「大学」「师范」「职业」</span>
      </div>`;
    return;
  }

  // 截断防止卡顿
  let displayList = allSchools;
  let truncated = false;
  if (allSchools.length > MAX_RESULTS) {
    displayList = allSchools.slice(0, MAX_RESULTS);
    truncated = true;
  }

  // 按省份分组
  const grouped = {};
  displayList.forEach(s => {
    if (!grouped[s.pname]) grouped[s.pname] = [];
    grouped[s.pname].push(s);
  });

  let html = `<div class="result-title">
                找到 <b>${allSchools.length}</b> 所相关高校
                ${truncated ? `（仅展示前 ${MAX_RESULTS} 条，请细化关键词）` : ""}
              </div>`;

  Object.keys(grouped).forEach(pname => {
    const list = grouped[pname];
    html += `<section class="region-block">`;
    html += `<div class="region-header">
               <h2>${escapeHtml(pname)}</h2>
               <span class="region-count">${list.length} 所</span>
             </div>`;
    html += `<div class="grid">`;
    list.forEach(s => {
      html += `<a class="school-card" href="${s.url}" target="_blank" rel="noopener">
                 <span class="sname">${escapeHtml(s.name)}</span>
                 <div class="smeta">
                   ${s.tag ? `<span class="${tagClass(s.tag)}">${escapeHtml(s.tag)}</span>` : ""}
                   <span class="sprov">${escapeHtml(s.pname)}</span>
                 </div>
               </a>`;
    });
    html += `</div></section>`;
  });

  app.innerHTML = html;
}

// ---------- 搜索入口 ----------
function doSearch() {
  const kw = document.getElementById("kw").value.trim();
  if (!kw) {
    renderProvinces();
    return;
  }
  renderSearchResults(kw);
}

// ---------- 事件绑定 ----------
document.getElementById("searchBtn").addEventListener("click", doSearch);
document.getElementById("kw").addEventListener("keyup", e => {
  if (e.key === "Enter") doSearch();
});

// 实时搜索（输入即搜，带 260ms 防抖）
let searchTimer = null;
document.getElementById("kw").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 260);
});

// ---------- 回到顶部 ----------
const backTop = document.getElementById("backTop");
window.addEventListener("scroll", () => {
  if (window.scrollY > 400) backTop.classList.add("show");
  else backTop.classList.remove("show");
});
backTop.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});

// ---------- 初始化 ----------
buildSchoolIndex();
renderProvinces();
</script>
</body>
</html>
