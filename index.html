<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>高校导航 · 中国大学官网导航</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   设计令牌（与主页面保持一致）
   ============================================================ */
:root {
  --bg:              #f6f7f9;
  --bg-elev:         #ffffff;
  --bg-sunken:       #eef1f5;
  --bg-hover:        #f0f3f7;
  --border:          #dfe3e8;
  --border-strong:   #c9cfd6;
  --text:            #1a1d21;
  --text-mute:       #5b6470;
  --text-dim:        #8a939f;
  --accent:          #1d4ed8;
  --accent-hover:    #1e40af;
  --accent-soft:     #e6ecfc;
  --accent-text:     #ffffff;
  --success:         #16a34a;
  --warn:            #ea580c;
  --purple:          #7c3aed;
  --danger:          #dc2626;
  --cyan:            #0891b2;
  --gold:            #b45309;
  --header-h:        64px;
  --t:               160ms cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:              #0b0e14;
  --bg-elev:         #12161f;
  --bg-sunken:       #0a0d12;
  --bg-hover:        #1a202c;
  --border:          #232b38;
  --border-strong:   #313b4c;
  --text:            #e6e9ef;
  --text-mute:       #97a3b4;
  --text-dim:        #64707f;
  --accent:          #4f8cf7;
  --accent-hover:    #6ba0ff;
  --accent-soft:     #16233b;
  --success:         #34d399;
  --warn:            #fb923c;
  --purple:          #a78bfa;
  --danger:          #f87171;
  --cyan:            #22d3ee;
  --gold:            #fbbf24;
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  border-radius: 0 !important;
}
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
               "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text);
  transition: background var(--t), color var(--t);
  overflow-x: hidden;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--accent-text); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-sunken); }
::-webkit-scrollbar-thumb { background: var(--border-strong); border: 2px solid var(--bg-sunken); }

/* ============================================================
   顶栏
   ============================================================ */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  transition: background var(--t), border-color var(--t);
}
.topbar-left, .topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .3px;
}
.brand-mark {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0;
  flex-shrink: 0;
}
.brand-text { color: var(--text); }
.brand-text .sub {
  color: var(--text-dim);
  font-weight: 400;
  font-size: 12px;
  letter-spacing: .5px;
  padding-left: 10px;
  border-left: 1px solid var(--border);
  margin-left: 2px;
}

.icon-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-mute);
  cursor: pointer;
  transition: background var(--t), color var(--t), border-color var(--t);
  font-size: 16px;
  flex-shrink: 0;
}
.icon-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
  border-color: var(--border);
}
.icon-btn:active { transform: translateY(1px); }
.icon-btn svg { width: 18px; height: 18px; }

.theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun  { display: none; }
[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

/* ============================================================
   主体
   ============================================================ */
main {
  padding-top: var(--header-h);
  min-height: calc(100vh - var(--header-h));
}

/* 省份头图 */
.province-hero {
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  padding: 48px 24px 36px;
  position: relative;
  overflow: hidden;
}
.province-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 36px 36px;
  opacity: .16;
  mask-image: radial-gradient(ellipse at top left, #000 15%, transparent 65%);
  -webkit-mask-image: radial-gradient(ellipse at top left, #000 15%, transparent 65%);
  pointer-events: none;
}
.province-hero-inner {
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}
.province-hero .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  padding: 5px 10px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  margin-bottom: 14px;
}
.province-hero h1 {
  font-size: clamp(26px, 4vw, 40px);
  font-weight: 800;
  letter-spacing: -.5px;
  line-height: 1.15;
  display: flex;
  align-items: center;
  gap: 14px;
}
.province-hero h1 .emoji {
  font-size: .85em;
  line-height: 1;
}
.province-hero .hero-desc {
  font-size: 14.5px;
  color: var(--text-mute);
  margin-top: 10px;
}

.province-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  min-width: 280px;
  flex: 0 1 auto;
}
.province-stat {
  background: var(--bg-elev);
  padding: 12px 16px;
  text-align: center;
}
.province-stat .num {
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -.5px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.province-stat .lbl {
  font-size: 10.5px;
  color: var(--text-dim);
  letter-spacing: .8px;
  text-transform: uppercase;
  margin-top: 3px;
}

/* 筛选栏 */
.filter-bar {
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  position: sticky;
  top: var(--header-h);
  z-index: 80;
  transition: background var(--t), border-color var(--t);
}
.filter-bar-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.search-bar {
  flex: 1;
  min-width: 220px;
  max-width: 460px;
  display: flex;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
  transition: border-color var(--t), box-shadow var(--t);
}
.search-bar:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search-bar input {
  flex: 1;
  padding: 10px 14px;
  border: none;
  background: transparent;
  outline: none;
  font-size: 14.5px;
  color: var(--text);
  min-width: 0;
}
.search-bar input::placeholder { color: var(--text-dim); }
.search-bar button {
  padding: 0 18px;
  border: none;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: .5px;
  cursor: pointer;
  transition: background var(--t);
}
.search-bar button:hover { background: var(--accent-hover); }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  padding: 6px 14px;
  font-size: 13px;
  letter-spacing: .3px;
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-mute);
  cursor: pointer;
  transition: all var(--t);
  user-select: none;
}
.chip:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
}
.chip .cnt {
  font-size: 11px;
  opacity: .7;
  margin-left: 4px;
  font-variant-numeric: tabular-nums;
}

/* 内容区 */
.content-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 24px 72px;
}
.result-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  margin-bottom: 18px;
  font-size: 13px;
  color: var(--text-mute);
  flex-wrap: wrap;
  gap: 8px;
}
.result-info b {
  color: var(--accent);
  font-weight: 800;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.result-info .right {
  font-size: 12.5px;
  color: var(--text-dim);
}

/* 学校网格 */
.school-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}
.school-card {
  background: var(--bg-elev);
  padding: 16px 18px;
  cursor: pointer;
  transition: background var(--t);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 80px;
}
.school-card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform var(--t);
}
.school-card:hover { background: var(--bg-hover); }
.school-card:hover::before { transform: scaleY(1); }
.school-card:hover .sname { color: var(--accent); }
.school-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.school-card .sname {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
  transition: color var(--t);
  letter-spacing: .1px;
}
.school-card .sname mark {
  background: rgba(29,78,216,.18);
  color: var(--accent);
  padding: 0 2px;
}
.school-card .smeta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: auto;
}

/* 标签 */
.tag {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .4px;
  padding: 2px 6px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
}
.tag.t-zhuanke { background: rgba(22,163,74,.1);  color: var(--success); }
.tag.t-minban  { background: rgba(234,88,12,.1);  color: var(--warn); }
.tag.t-gaozhi  { background: rgba(124,58,237,.1); color: var(--purple); }
[data-theme="dark"] .tag.t-zhuanke { background: rgba(52,211,153,.12); }
[data-theme="dark"] .tag.t-minban  { background: rgba(251,146,60,.12); }
[data-theme="dark"] .tag.t-gaozhi  { background: rgba(167,139,250,.12); }

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 72px 24px;
  border: 1px dashed var(--border-strong);
  background: var(--bg-elev);
  color: var(--text-mute);
  font-size: 14px;
  line-height: 1.9;
}
.empty-state .emoji {
  font-size: 36px;
  display: block;
  margin-bottom: 12px;
  opacity: .6;
}
.empty-state .hint {
  font-size: 12.5px;
  color: var(--text-dim);
  margin-top: 8px;
}

/* 页脚 */
.footer {
  border-top: 1px solid var(--border);
  background: var(--bg-elev);
  padding: 26px 24px;
}
.footer-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--text-dim);
  letter-spacing: .2px;
}
.footer-inner a { color: var(--text-mute); border-bottom: 1px solid transparent; transition: all var(--t); }
.footer-inner a:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* 回到顶部 */
.back-top {
  position: fixed;
  right: 22px;
  bottom: 22px;
  width: 42px; height: 42px;
  background: var(--bg-elev);
  color: var(--text-mute);
  border: 1px solid var(--border-strong);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 90;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: all var(--t);
}
.back-top.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
.back-top:hover {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
}

/* 弹窗 */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8,10,15,.65);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(2px);
}
.modal-overlay.active { display: flex; animation: fade .2s; }
@keyframes fade {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.modal {
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  width: 100%;
  max-width: 720px;
  max-height: 86vh;
  overflow-y: auto;
  padding: 32px 32px 28px;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 14px; right: 14px;
  width: 34px; height: 34px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-mute);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--t);
}
.modal-close:hover {
  background: var(--bg-hover);
  color: var(--text);
  border-color: var(--border-strong);
}
.modal h3 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.3px;
  margin-bottom: 6px;
  padding-right: 44px;
}
.modal .modal-sub {
  font-size: 13px;
  color: var(--text-mute);
  margin-bottom: 16px;
  letter-spacing: .2px;
}
.modal .modal-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 22px;
}
.modal-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 20px;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: .3px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--t);
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-text);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--border-strong);
}
.btn-ghost:hover {
  background: var(--bg-hover);
  border-color: var(--accent);
  color: var(--accent);
}
.modal-data {
  border-top: 1px solid var(--border);
  padding-top: 20px;
}
.modal-data .lbl {
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 12px;
  font-weight: 700;
}
.modal-data-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}
.modal-data-item {
  background: var(--bg-elev);
  padding: 12px 14px;
}
.modal-data-item .year {
  font-size: 11.5px;
  color: var(--text-dim);
  letter-spacing: .5px;
}
.modal-data-item .val {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  margin-top: 2px;
  letter-spacing: -.3px;
}
.modal-data-item .val small {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 400;
  margin-left: 3px;
  letter-spacing: .3px;
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 640px) {
  :root { --header-h: 58px; }
  .topbar { padding: 0 14px; }
  .brand-text .sub { display: none; }
  .brand { font-size: 14.5px; }
  .brand-mark { width: 26px; height: 26px; font-size: 11px; }

  .province-hero { padding: 32px 16px 26px; }
  .province-hero-inner { flex-direction: column; align-items: stretch; gap: 20px; }
  .province-hero h1 { font-size: 24px; }
  .province-hero .hero-desc { font-size: 13px; }
  .province-stats { min-width: 0; width: 100%; grid-template-columns: repeat(3, 1fr); }

  .filter-bar { padding: 12px 16px; }
  .search-bar { max-width: 100%; min-width: 0; }
  .content-wrap { padding: 20px 16px 48px; }

  .school-grid { grid-template-columns: 1fr; }
  .school-card { padding: 14px 16px; min-height: 72px; }

  .modal { padding: 24px 20px 22px; }
  .modal h3 { font-size: 18px; }
  .modal-data-list { grid-template-columns: repeat(2, 1fr); }
  .footer-inner { flex-direction: column; text-align: center; }
  .back-top { right: 14px; bottom: 14px; width: 38px; height: 38px; }
}

@media (min-width: 641px) and (max-width: 1024px) {
  .school-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 1440px) {
  .content-wrap, .province-hero-inner, .footer-inner, .filter-bar-inner { max-width: 1320px; }
}
</style>
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="topbar-left">
    <a class="icon-btn" href="index.html" title="返回首页" aria-label="返回首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </a>
    <div class="brand">
      <span class="brand-mark" id="provinceMark">--</span>
      <span class="brand-text" id="provinceTitle">
        加载中
        <span class="sub">UNIVERSITY LIST</span>
      </span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn theme-toggle" id="themeBtn" title="切换深浅模式" aria-label="切换深浅模式">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="5" y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.9" y1="4.9" x2="7" y2="7"/>
        <line x1="17" y1="17" x2="19.1" y2="19.1"/>
        <line x1="4.9" y1="19.1" x2="7" y2="17"/>
        <line x1="17" y1="7" x2="19.1" y2="4.9"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <section class="province-hero">
    <div class="province-hero-inner">
      <div>
        <div class="eyebrow" id="heroEyebrow">PROVINCE · 高校导航</div>
        <h1>
          <span class="emoji" id="heroEmoji">🏫</span>
          <span id="heroName">加载中…</span>
        </h1>
        <p class="hero-desc" id="heroDesc">正在读取数据…</p>
      </div>
      <div class="province-stats" id="heroStats"></div>
    </div>
  </section>

  <section class="filter-bar">
    <div class="filter-bar-inner">
      <div class="search-bar">
        <input type="text" id="kw" placeholder="搜索本省学校名称…" autocomplete="off">
        <button id="searchBtn">搜索</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <div class="content-wrap">
    <div class="result-info" id="resultInfo" style="display:none;"></div>
    <div class="school-grid" id="schoolList"></div>
    <div id="emptyBox" style="display:none;"></div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div>© 2025 中国大学官网导航 · 数据来源于
        <a href="http://www.moe.gov.cn/" target="_blank" rel="noopener">教育部</a>
      </div>
      <div>仅供学习交流 · 官网地址请以学校最新公布为准</div>
    </div>
  </footer>
</main>

<button class="back-top" id="backTop" title="回到顶部" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
    <line x1="12" y1="19" x2="12" y2="5"/>
    <polyline points="5 12 12 5 19 12"/>
  </svg>
</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
/* ============================================================
   识别省份
   ============================================================ */
const path = decodeURIComponent(location.pathname.split("/").pop() || "");
const provinceId = path.replace(/\.html$/i, "");
const provinceData = (typeof UNIVERSITY_DATA !== "undefined") ? UNIVERSITY_DATA[provinceId] : null;
const provinceMeta = (typeof PROVINCES !== "undefined")
  ? PROVINCES.find(p => p.id === provinceId)
  : null;

/* ============================================================
   主题
   ============================================================ */
const THEME_KEY = "cn-univ-nav-theme";
function getPreferredTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "light" || saved === "dark") return saved;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#060910" : "#ffffff");
}
applyTheme(getPreferredTheme());
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  localStorage.setItem(THEME_KEY, next);
});

/* ============================================================
   工具
   ============================================================ */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}
function escapeAttr(str) { return escapeHtml(str).replace(/"/g, "&quot;"); }

function tagClass(tag) {
  let cls = "tag";
  if (tag.includes("专科")) cls += " t-zhuanke";
  if (tag.includes("民办")) cls += " t-minban";
  if (tag.includes("职业")) cls += " t-gaozhi";
  return cls;
}

/* 分类判定 */
function classify(tag) {
  if (!tag) return "本科";
  if (tag.includes("专科")) return "专科";
  if (tag.includes("民办")) return "民办";
  if (tag.includes("双一流") || tag.includes("985") || tag.includes("211")) return "双一流";
  return "本科";
}

/* 关键词高亮 */
function highlight(text, kw) {
  if (!kw) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(kw.toLowerCase());
  if (idx < 0) return escapeHtml(text);
  const before = text.slice(0, idx);
  const match  = text.slice(idx, idx + kw.length);
  const after  = text.slice(idx + kw.length);
  return `${escapeHtml(before)}<mark>${escapeHtml(match)}</mark>${escapeHtml(after)}`;
}

/* ============================================================
   数据准备
   ============================================================ */
let allSchools = [];
let currentFilter = "全部";
let currentKeyword = "";

if (!provinceData) {
  document.querySelector("main").innerHTML = `
    <div class="empty-state" style="margin:80px auto;max-width:520px;">
      <span class="emoji">🧭</span>
      未找到该省份数据
      <div class="hint">请检查 URL 是否正确，或从
        <a href="index.html" style="color:var(--accent);">首页</a> 重新进入
      </div>
    </div>`;
  document.querySelector("main").style.paddingTop = "var(--header-h)";
} else {
  init();
}

function init() {
  allSchools = (provinceData.schools || []).map(s => ({
    name: s[0], url: s[1], tag: s[2] || "",
    category: classify(s[2] || "")
  }));

  // 页面标题
  document.title = `${provinceData.name}高校导航 · 中国大学官网导航`;

  // 顶栏
  document.getElementById("provinceMark").textContent =
    provinceMeta ? provinceMeta.name : provinceData.name;
  document.getElementById("provinceTitle").innerHTML =
    `${escapeHtml(provinceData.name)} <span class="sub">UNIVERSITY LIST</span>`;

  // Hero
  if (provinceMeta) {
    document.getElementById("heroEmoji").textContent = provinceMeta.emoji || "🏫";
  }
  document.getElementById("heroName").textContent = provinceData.name;
  document.getElementById("heroDesc").textContent =
    `共收录 ${allSchools.length} 所普通高校，点击校名即可查看详情与官网入口。`;

  // 统计
  const stats = {
    "全部":   allSchools.length,
    "双一流": allSchools.filter(s => s.category === "双一流").length,
    "本科":   allSchools.filter(s => s.category === "本科").length,
    "专科":   allSchools.filter(s => s.category === "专科").length,
    "民办":   allSchools.filter(s => s.category === "民办").length
  };
  document.getElementById("heroStats").innerHTML = `
    <div class="province-stat">
      <div class="num">${stats["双一流"]}</div>
      <div class="lbl">双一流</div>
    </div>
    <div class="province-stat">
      <div class="num">${stats["本科"]}</div>
      <div class="lbl">本科</div>
    </div>
    <div class="province-stat">
      <div class="num">${stats["专科"]}</div>
      <div class="lbl">专科</div>
    </div>
  `;

  // 筛选 chips
  const chips = document.getElementById("chips");
  const filters = ["全部", "双一流", "本科", "专科", "民办"];
  chips.innerHTML = filters.map(f => {
    const cnt = stats[f] || 0;
    const isActive = f === "全部" ? "active" : "";
    return `<button class="chip ${isActive}" data-filter="${f}">
      ${f}<span class="cnt">${cnt}</span>
    </button>`;
  }).join("");

  chips.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    currentFilter = chip.dataset.filter;
    chips.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    renderList();
  });

  // 搜索
  const kw = document.getElementById("kw");
  document.getElementById("searchBtn").addEventListener("click", () => {
    currentKeyword = kw.value.trim();
    renderList();
  });
  kw.addEventListener("keyup", e => {
    if (e.key === "Enter") {
      currentKeyword = kw.value.trim();
      renderList();
    }
  });
  let timer = null;
  kw.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      currentKeyword = kw.value.trim();
      renderList();
    }, 260);
  });

  renderList();
}

/* ============================================================
   渲染列表
   ============================================================ */
function renderList() {
  const listBox  = document.getElementById("schoolList");
  const infoBox  = document.getElementById("resultInfo");
  const emptyBox = document.getElementById("emptyBox");

  let list = allSchools;
  if (currentFilter !== "全部") {
    if (currentFilter === "民办") {
      list = list.filter(s => s.tag.includes("民办"));
    } else {
      list = list.filter(s => s.category === currentFilter);
    }
  }
  if (currentKeyword) {
    const kw = currentKeyword.toLowerCase();
    list = list.filter(s => s.name.toLowerCase().includes(kw));
  }

  // 结果信息
  if (currentFilter !== "全部" || currentKeyword) {
    infoBox.style.display = "";
    const parts = [];
    if (currentFilter !== "全部") parts.push(`分类「${currentFilter}」`);
    if (currentKeyword) parts.push(`关键词「${escapeHtml(currentKeyword)}」`);
    infoBox.innerHTML = `
      <div>筛选条件 ${parts.join(" · ")} · 命中 <b>${list.length}</b> 所</div>
      <div class="right">共 ${allSchools.length} 所</div>
    `;
  } else {
    infoBox.style.display = "none";
  }

  // 空状态
  if (!list.length) {
    listBox.innerHTML = "";
    emptyBox.style.display = "";
    emptyBox.innerHTML = `
      <div class="empty-state">
        <span class="emoji">🔍</span>
        未找到匹配的学校
        <div class="hint">试试清除筛选条件或换个关键词</div>
      </div>`;
    return;
  }
  emptyBox.style.display = "none";

  // 渲染
  listBox.innerHTML = list.map(s => `
    <div class="school-card" tabindex="0" role="button"
         data-name="${escapeAttr(s.name)}"
         aria-label="查看 ${escapeAttr(s.name)} 详情">
      <span class="sname">${highlight(s.name, currentKeyword)}</span>
      <div class="smeta">
        ${s.tag ? `<span class="${tagClass(s.tag)}">${escapeHtml(s.tag)}</span>` : ""}
      </div>
    </div>
  `).join("");

  // 事件绑定
  listBox.querySelectorAll(".school-card").forEach(card => {
    const open = () => openUniversityModal(card.dataset.name);
    card.addEventListener("click", open);
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        open();
      }
    });
  });
}

/* ============================================================
   弹窗
   ============================================================ */
const modalOverlay = document.getElementById("modalOverlay");
const modalContent = document.getElementById("modalContent");

function openUniversityModal(name) {
  const info = allSchools.find(s => s.name === name);
  if (!info) return;

  const scoreData = (typeof SCORE_HISTORY !== "undefined") ? SCORE_HISTORY[name] : null;

  let html = `<h3>${escapeHtml(name)}</h3>
    <div class="modal-sub">${escapeHtml(provinceData.name)}</div>
    <div class="modal-tags">
      ${info.tag ? `<span class="${tagClass(info.tag)}">${escapeHtml(info.tag)}</span>` : ""}
    </div>
    <div class="modal-actions">
      <a class="btn btn-primary" href="${escapeAttr(info.url)}" target="_blank" rel="noopener">
        🌐 访问官网
      </a>
      <a class="btn btn-ghost" href="index.html#panel-detail">
        📈 查看录取数据
      </a>
    </div>`;

  if (scoreData && scoreData.years) {
    html += `<div class="modal-data">
      <div class="lbl">Recent Admission · 近年录取</div>
      <div class="modal-data-list">`;
    scoreData.years.forEach((y, i) => {
      const score = scoreData.minScores ? scoreData.minScores[i] : null;
      const enroll = scoreData.enrollment ? scoreData.enrollment[i] : null;
      html += `<div class="modal-data-item">
        <div class="year">${y} 年</div>
        <div class="val">
          ${score != null ? score : "—"}<small>分</small>
          ${enroll != null ? `<br><small style="font-size:11px;color:var(--text-dim);">招 ${enroll} 人</small>` : ""}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  } else {
    html += `<div class="modal-data">
      <div class="lbl">Admission Data · 录取数据</div>
      <div style="font-size:13px;color:var(--text-dim);padding:8px 0;">
        暂无录取数据，可前往首页「大学录取数据」板块查看。
      </div>
    </div>`;
  }

  modalContent.innerHTML = html;
  modalOverlay.classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  modalOverlay.classList.remove("active");
  document.body.style.overflow = "";
}
document.getElementById("modalClose").addEventListener("click", closeModal);
modalOverlay.addEventListener("click", e => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modalOverlay.classList.contains("active")) closeModal();
});

/* ============================================================
   回到顶部
   ============================================================ */
const backTop = document.getElementById("backTop");
window.addEventListener("scroll", () => {
  backTop.classList.toggle("show", window.scrollY > 400);
}, { passive: true });
backTop.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
</html>
