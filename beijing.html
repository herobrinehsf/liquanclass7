<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="本省高校官网导航，点击校名直达学校官方网站。">
<title>高校导航 · 加载中…</title>
<style>
  :root {
    --primary: #1e3c72;
    --primary-light: #2a5298;
    --accent: #3b82f6;
    --bg: #f5f7fa;
    --card: #fff;
    --text: #333;
    --text-muted: #999;
    --radius: 12px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    --shadow-md: 0 8px 22px rgba(0,0,0,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
    padding: 34px 20px 26px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute;
    top: -60%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: relative;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-emoji {
    font-size: 40px;
    line-height: 1;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.25));
  }
  .header-titles h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: .5px;
  }
  .header-titles .sub {
    font-size: 13px;
    opacity: .85;
    margin-top: 2px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: rgba(255,255,255,.15);
    color: #fff;
    text-decoration: none;
    border-radius: 22px;
    font-size: 13.5px;
    border: 1px solid rgba(255,255,255,.22);
    transition: background .2s;
  }
  .back-btn:hover { background: rgba(255,255,255,.28); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    max-width: 1180px;
    margin: -14px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 3;
  }
  .search-bar {
    display: flex;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(0,0,0,.12);
  }
  .search-bar input {
    flex: 1;
    padding: 13px 18px;
    border: none;
    font-size: 14.5px;
    outline: none;
    color: var(--text);
  }
  .search-bar button {
    padding: 0 26px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  .search-bar button:hover { background: #2563eb; }

  .filters {
    max-width: 1180px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .filter-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-right: 4px;
  }
  .filter-btn {
    padding: 5px 14px;
    border-radius: 18px;
    border: 1px solid #e2e8f0;
    background: #fff;
    color: #475569;
    font-size: 13px;
    cursor: pointer;
    transition: all .18s;
  }
  .filter-btn:hover { border-color: var(--primary-light); color: var(--primary-light); }
  .filter-btn.active {
    background: var(--primary-light);
    border-color: var(--primary-light);
    color: #fff;
  }

  /* ---------- Main ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 26px 20px 60px;
  }
  .result-info {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .result-info b { color: var(--primary-light); font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 13px;
  }

  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    transition: transform .16s ease, box-shadow .16s ease;
    border: 1px solid rgba(0,0,0,.03);
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,.1);
  }
  .card a {
    text-decoration: none;
    color: var(--primary);
    font-weight: 600;
    font-size: 15px;
    display: block;
    line-height: 1.4;
    word-break: break-all;
  }
  .card a:hover { color: var(--primary-light); }
  .card .tags {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .card .tag {
    display: inline-block;
    font-size: 11px;
    color: #fff;
    background: var(--primary-light);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .card .tag.zhuanke { background: #16a34a; }
  .card .tag.minban  { background: #ea580c; }
  .card .tag.gaozhi  { background: #7c3aed; }

  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 2;
  }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    padding: 30px 20px 40px;
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.9;
    border-top: 1px solid rgba(0,0,0,.05);
    background: #fff;
  }
  footer a { color: var(--primary-light); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ---------- 回到顶部 ---------- */
  #backTop {
    position: fixed;
    right: 22px;
    bottom: 30px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--primary-light);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(42,82,152,.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 99;
  }
  #backTop.show { opacity: 1; pointer-events: auto; }
  #backTop:hover { transform: translateY(-3px); }

  /* ---------- 响应式 ---------- */
  @media (max-width: 640px) {
    .header-titles h1 { font-size: 19px; }
    .header-emoji { font-size: 30px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card { padding: 13px 14px; }
    .card a { font-size: 14px; }
    .search-bar button { padding: 0 18px; }
    header { padding: 24px 16px 22px; }
    .filters { padding: 0 14px; }
    main { padding: 22px 14px 50px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <div class="header-emoji" id="emoji">📍</div>
      <div class="header-titles">
        <h1 id="pageTitle">加载中…</h1>
        <div class="sub" id="pageSub"></div>
      </div>
    </div>
    <a href="index.html" class="back-btn">← 返回全国导航</a>
  </div>
</header>

<div class="toolbar">
  <div class="search-bar">
    <input type="text" id="kw" placeholder="搜索本省学校名称…" autocomplete="off">
    <button id="searchBtn">搜索</button>
  </div>
</div>

<div class="filters" id="filters">
  <span class="filter-label">筛选：</span>
  <button class="filter-btn active" data-filter="all">全部</button>
  <button class="filter-btn" data-filter="benke">本科</button>
  <button class="filter-btn" data-filter="zhuanke">专科</button>
  <button class="filter-btn" data-filter="shuangyiliu">双一流</button>
  <button class="filter-btn" data-filter="minban">民办</button>
</div>

<main>
  <div class="result-info" id="resultInfo"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  数据来源：<a href="http://www.moe.gov.cn/" target="_blank" rel="noopener">教育部《全国高等学校名单》</a>（截至 2025 年 6 月 20 日）<br>
  提示：部分官网地址可能更新，请以学校最新公布为准 · 本站仅供学习交流使用
</footer>

<button id="backTop" title="回到顶部">↑</button>

<script src="data.js"></script>
<script>
/* ============================================================
   省份页面通用逻辑
   自动从 URL 文件名中识别省份 ID
   ============================================================ */

// ---------- 1. 从 URL 中提取省份 ID ----------
function detectProvinceId() {
  // 去掉 query string 和 hash
  let path = window.location.pathname.split("?")[0].split("#")[0];
  // 取出最后一段文件名
  let filename = path.substring(path.lastIndexOf("/") + 1);
  // 去掉 .html 后缀
  let id = filename.replace(/\.html?$/i, "");
  // 若为空（例如访问目录），回退到 root 页面
  return id || "index";
}

const PROVINCE_ID = detectProvinceId();
const provinceData = (typeof UNIVERSITY_DATA !== "undefined") ? UNIVERSITY_DATA[PROVINCE_ID] : null;
const provinceMeta = (typeof PROVINCES !== "undefined") ? PROVINCES.find(p => p.id === PROVINCE_ID) : null;

// ---------- 2. 工具函数 ----------
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function tagClass(tag) {
  let cls = "tag";
  if (tag.includes("专科")) cls += " zhuanke";
  if (tag.includes("民办")) cls += " minban";
  if (tag.includes("职业")) cls += " gaozhi";
  return cls;
}

// ---------- 3. 状态 ----------
let state = {
  keyword: "",
  filter: "all",
  allSchools: []
};

// ---------- 4. 筛选逻辑 ----------
function applyFilter(list) {
  const kw = state.keyword.toLowerCase();
  const filter = state.filter;
  return list.filter(s => {
    // 关键词
    if (kw && !s[0].toLowerCase().includes(kw)) return false;
    // 分类
    const tag = s[2] || "";
    if (filter === "benke") return tag.includes("本科");
    if (filter === "zhuanke") return tag.includes("专科");
    if (filter === "shuangyiliu") return tag.includes("双一流") || tag.includes("211") || tag.includes("985");
    if (filter === "minban") return tag.includes("民办");
    return true;
  });
}

// ---------- 5. 渲染 ----------
function render() {
  const grid = document.getElementById("grid");
  const info = document.getElementById("resultInfo");
  const list = applyFilter(state.allSchools);

  if (!state.allSchools.length) {
    info.textContent = "";
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">
      📭 暂未收录本省份高校数据<br>
      <span style="font-size:12.5px;opacity:.7;">欢迎在 data.js 中补充</span>
    </div>`;
    return;
  }

  if (!list.length) {
    info.innerHTML = `共 <b>${state.allSchools.length}</b> 所高校 · 当前筛选条件下无结果`;
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">
      😢 未找到匹配学校<br>
      <span style="font-size:12.5px;opacity:.7;">换个关键词或切换筛选条件试试</span>
    </div>`;
    return;
  }

  info.innerHTML = `共 <b>${state.allSchools.length}</b> 所高校 · 当前展示 <b>${list.length}</b> 所`;

  grid.innerHTML = list.map(s => {
    const tags = s[2] ? s[2].split("/").map(t => `<span class="${tagClass(t)}">${escapeHtml(t)}</span>`).join("") : "";
    return `<div class="card">
      <a href="${s[1]}" target="_blank" rel="noopener">${escapeHtml(s[0])}</a>
      <div class="tags">${tags}</div>
    </div>`;
  }).join("");
}

// ---------- 6. 初始化页面 ----------
function init() {
  const emojiEl = document.getElementById("emoji");
  const titleEl = document.getElementById("pageTitle");
  const subEl = document.getElementById("pageSub");

  if (provinceData) {
    const emoji = provinceMeta ? provinceMeta.emoji : "📍";
    const name = provinceData.name || (provinceMeta ? provinceMeta.name : PROVINCE_ID);
    document.title = `${name}高校导航 · 中国大学官网导航`;
    emojiEl.textContent = emoji;
    titleEl.textContent = `${name}高校导航`;
    subEl.textContent = `共收录 ${provinceData.schools.length} 所高校 · 点击校名直达官网`;
    state.allSchools = provinceData.schools || [];
    render();
  } else {
    // 未找到省份数据
    emojiEl.textContent = "❓";
    titleEl.textContent = "未找到该省份数据";
    subEl.textContent = `省份 ID：${PROVINCE_ID}`;
    document.getElementById("resultInfo").textContent = "";
    document.getElementById("grid").innerHTML = `<div class="empty" style="grid-column:1/-1;">
      😵 未在 data.js 中找到 <b>${escapeHtml(PROVINCE_ID)}</b> 的数据<br>
      <span style="font-size:12.5px;opacity:.7;">请检查文件名是否与 PROVINCES 中的 id 一致</span>
    </div>`;
  }
}

// ---------- 7. 事件绑定 ----------
function bindEvents() {
  const kwInput = document.getElementById("kw");

  // 搜索按钮
  document.getElementById("searchBtn").addEventListener("click", () => {
    state.keyword = kwInput.value.trim();
    render();
  });

  // 回车 / 实时搜索
  let timer = null;
  kwInput.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      state.keyword = kwInput.value.trim();
      render();
    }, 220);
  });
  kwInput.addEventListener("keyup", e => {
    if (e.key === "Enter") {
      clearTimeout(timer);
      state.keyword = kwInput.value.trim();
      render();
    }
  });

  // 筛选按钮
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.filter = btn.dataset.filter;
      render();
    });
  });

  // 回到顶部
  const backTop = document.getElementById("backTop");
  window.addEventListener("scroll", () => {
    if (window.scrollY > 400) backTop.classList.add("show");
    else backTop.classList.remove("show");
  });
  backTop.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

// ---------- 8. 启动 ----------
init();
bindEvents();
</script>
</body>
</html>
